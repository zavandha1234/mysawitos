name: Build My Sawit OS ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential gcc-multilib nasm python3 grub-pc-bin grub-common xorriso mtools
      - run: chmod +x build.sh && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MySawitOS-v1.0-iso
          path: MySawitOS-v1.0.iso
